apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-pipeline-worker
  namespace: default
  labels:
    app: temporal-pipeline-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: temporal-pipeline-worker
  template:
    metadata:
      labels:
        app: temporal-pipeline-worker
    spec:
      containers:
        - name: worker
          image: temporal-pipeline-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: temporal-pipeline-config
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: shared-storage
              mountPath: "/app/Output Aligned Queryable Data"
              subPath: "output-data"
            - name: shared-storage
              mountPath: "/app/Generated Traces"
              subPath: "traces"
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: temporal-shared-storage-pvc
